
name: Docker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository_owner == 'FeroxFoxxo'
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build \
            -t ghcr.io/feroxfoxxo/dexter_backend:latest \
            ./backend

      - name: Push backend
        run: |
          docker push ghcr.io/feroxfoxxo/dexter_backend:latest

      - name: Build frontend
        run: |
          docker build \
            -t ghcr.io/feroxfoxxo/dexter_frontend:latest \
            ./frontend

      - name: Push frontend
        run: |
          docker push ghcr.io/feroxfoxxo/dexter_frontend:latest

      - name: Send Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: "🚀 Published Dexter backend and frontend successfully! 🚀"
