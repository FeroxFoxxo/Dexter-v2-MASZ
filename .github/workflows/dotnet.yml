
name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET version
        run: dotnet --info

      - name: Clean
        working-directory: ./backend
        run: dotnet clean Dexter.sln -c Release

      - name: Restore dependencies
        working-directory: ./backend
        run: dotnet restore Dexter.sln

      - name: Build
        working-directory: ./backend
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet build Dexter.sln --no-restore -c Release -p:SixLaborsLicenseKey="$SIXLABORS_LICENSE_KEY"

      - name: Test
        working-directory: ./backend
        run: dotnet test Dexter.sln --no-build -c Release --verbosity normal
