services:
  db:
    container_name: dexter_db
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql --protocol=tcp -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - appnetwork

  backend:
    container_name: dexter_backend
    image: ghcr.io/feroxfoxxo/dexter_backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID:?Set DISCORD_OAUTH_CLIENT_ID in .env}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET:?Set DISCORD_OAUTH_CLIENT_SECRET in .env}
      DISCORD_SITE_ADMINS: ${DISCORD_SITE_ADMINS:-}
      META_SERVICE_BASE_URL: ${META_SERVICE_BASE_URL:?Set META_SERVICE_BASE_URL in .env}
      META_SERVICE_NAME: ${META_SERVICE_NAME:-Dexter}
      META_SERVICE_DOMAIN: ${META_SERVICE_DOMAIN:?Set META_SERVICE_DOMAIN in .env}
      ABSOLUTE_PATH_TO_FILE_UPLOAD: /filehost/
    volumes:
      - filehost:/filehost
    networks:
      - appnetwork

  nginx:
    container_name: dexter_frontend
    image: ghcr.io/feroxfoxxo/dexter_frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:5565:80'
    networks:
      - appnetwork

volumes:
  mysql:
  filehost:

networks:
  appnetwork:
    driver: bridge

